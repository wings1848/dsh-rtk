name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The default token is read/write on everything; this workflow only reads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.18.0 is the declared engines floor: the first release where Node
        # strips TypeScript types by default and without an experimental warning.
        # The test files rely on that, so the floor is exercised, not assumed.
        node: ['22.18.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The integration suite drives the real `rtk` binary -- the rewrite path is
      # the feature, and a stub would only prove the stub works. A runner has no
      # rtk and no DSH install; rtk is fetched from its own releases, and
      # `link-dsh` falls back to the registry copies of the harness peers, which
      # is enough because the suite never loads a real harness.
      - name: Install rtk
        run: |
          set -euo pipefail
          version=$(curl -fsSL https://api.github.com/repos/rtk-ai/rtk/releases/latest \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "installing rtk ${version}"
          mkdir -p "$RUNNER_TEMP/rtk"
          curl -fsSL -o "$RUNNER_TEMP/rtk.tar.gz" \
            "https://github.com/rtk-ai/rtk/releases/download/${version}/rtk-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf "$RUNNER_TEMP/rtk.tar.gz" -C "$RUNNER_TEMP/rtk"
          sudo install -m 0755 "$(find "$RUNNER_TEMP/rtk" -type f -name rtk | head -1)" /usr/local/bin/rtk
          rtk --version

      - run: pnpm run check

  dist:
    name: dist is reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `prepack` builds lib/. Publishing a stale or missing lib/ would ship a
      # package that cannot be imported, so pack it and import it back.
      - run: npm pack
      - name: the packed tarball exposes the plugin contract
        run: |
          set -euo pipefail
          # Unpack inside the checkout rather than /tmp: the @deepseek-ai/* peers
          # are resolved by walking up from the importing file, and only the
          # checkout has them installed.
          rm -rf .dist-check && mkdir -p .dist-check
          # npm names a scoped tarball after the scope as well, so this is
          # `wingsbutterfly-dsh-rtk-<version>.tgz`, not `dsh-rtk-<version>.tgz`.
          # Globbing the only tarball in the checkout avoids encoding either
          # shape: the rename is invisible until the package gets a scope.
          tar -xzf ./*.tgz -C .dist-check
          node --input-type=module -e "
            const plugin = await import('./.dist-check/package/lib/index.js')
            const missing = ['name', 'inject', 'Config', 'apply'].filter(key => plugin[key] === undefined)
            if (missing.length > 0) throw new Error('missing exports: ' + missing.join(', '))
            if (typeof plugin.apply !== 'function') throw new Error('apply is not a function')
            if (!Array.isArray(plugin.inject) || !plugin.inject.includes('tools')) throw new Error('inject must declare tools')
            console.log('packed entry exports:', Object.keys(plugin).sort().join(', '))
          "
          rm -rf .dist-check

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high and critical advisories only. Every runtime dependency is a
      # harness peer the deployment supplies, so a finding here is a transitive
      # one worth knowing about rather than a reason to rewrite the plugin.
      - run: pnpm audit --audit-level high

  dependency-review:
    name: dependency review
    # Only meaningful on a pull request: it diffs the manifest against the base
    # branch. There is nothing to compare on a push to main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Complements `pnpm audit`, which reports what is vulnerable *now*. This
      # reports what the pull request is *adding* -- a different question, and
      # the one that stops a bad dependency at the door instead of after it lands.
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
